name: Build and Release Water Pump Firmware

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build All Targets
        run: |
          pio run -e esp01_1m
          pio run -e esp32dev
          pio run -e esp32s3
          pio run -e esp32c3

      - name: Package Release Assets
        run: |
          mkdir -p release_assets
          cp .pio/build/esp01_1m/firmware.bin release_assets/firmware-water_pump-esp01s.bin
          cp .pio/build/esp32dev/firmware.bin release_assets/firmware-water_pump-esp32.bin
          cp .pio/build/esp32s3/firmware.bin release_assets/firmware-water_pump-esp32s3.bin
          cp .pio/build/esp32c3/firmware.bin release_assets/firmware-water_pump-esp32c3.bin
          
          cd release_assets
          for f in *.bin; do
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Determine Target Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
