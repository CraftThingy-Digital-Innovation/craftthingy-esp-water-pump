; =================================================================
; CraftThingy Digital Innovation - Water Pump Controller
; Targets: ESP8266 (ESP-01/01S 1MB Flash) & All ESP32 Variants
; =================================================================

[platformio]
default_envs = esp01_1m, esp32dev, esp32s3, esp32c3
src_dir = .

[env]
framework = arduino
monitor_speed = 115200
lib_extra_dirs = 
    ../craftthingy-esp-core-ota/lib
    ./lib
build_flags =
    -I ../craftthingy-esp-core-ota/include
    -I ../craftthingy-esp-core-ota/lib/CraftThingyCore/src
    -I .
    -D CORE_DEBUG_LEVEL=0
    -D CRAFT_CONTROLLER_ROLE=\"water_pump\"
    -D CRAFT_DEFAULT_ROLE=\"water_pump\"
    -D CRAFT_DEFAULT_CONTROLLER_REPO=\"craftthingy-esp-water-pump\"
    -D APP_VERSION=\"1.1.9\"

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = ${env.framework}
monitor_speed = ${env.monitor_speed}
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m.ld     ; 1MB flash: ~1020KB sketch / OTA space (no unused SPIFFS/LittleFS)
build_flags =
    ${env.build_flags}
    -D BOARD_TYPE=\"esp8266\"
    -D ASSET_TAG=\"esp01s\"
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK305
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -fno-rtti
    -Os

[env:esp32dev]
platform = espressif32 @ 6.6.0
board = esp32dev
framework = ${env.framework}
monitor_speed = ${env.monitor_speed}
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D BOARD_TYPE=\"esp32\"
    -D ASSET_TAG=\"esp32\"
    -Os

[env:esp32s3]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = ${env.framework}
monitor_speed = ${env.monitor_speed}
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -D BOARD_TYPE=\"esp32s3\"
    -D ASSET_TAG=\"esp32s3\"
    -Os

[env:esp32c3]
platform = espressif32 @ 6.6.0
board = esp32-c3-devkitm-1
framework = ${env.framework}
monitor_speed = ${env.monitor_speed}
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D BOARD_TYPE=\"esp32c3\"
    -D ASSET_TAG=\"esp32c3\"
    -Os
